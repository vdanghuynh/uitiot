url: "https://vdanghuynh.github.io"
baseurl: "/uitiot"

markdown: kramdown
permalink: pretty
plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - serve.sh
  - vendor
  - node_modules
  - scripts
