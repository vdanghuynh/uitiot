# Site settings. Edit the values below, everything else is driven by files in _data/.
title: UiTiOt Research Group
tagline: Intelligent optimization for networked computing systems
description: >-
  UiTiOt Research Group, Department of Computer Networks, VNUHCM-UIT. We work on digital twins
  and IoT, edge and cloud computing, next-generation wireless networks, and quantum computing
  and cybersecurity.
lang: en

# Hosted as a project site under the personal account: https://vdanghuynh.github.io/uitiot/
