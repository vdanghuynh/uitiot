name: UiTiOt Research Group
short_name: UiTiOt
affiliation: Department of Computer Networks, Faculty of Computer Networks and Communications
institution: University of Information Technology, Vietnam National University Ho Chi Minh City (VNUHCM-UIT)
founded: 2017
mission: >-
  We build and evaluate optimization and learning methods that keep networked computing systems
  reliable, adaptive, and secure, from IoT devices and edge servers to UAVs, satellites, and quantum hardware.
leads: Co-led by Assoc. Prof. Quan Le-Trung and Dr. Dang Van Huynh

