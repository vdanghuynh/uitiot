{% assign fig_src = nil %}
{% for p in site.data.group.research_figure.paths %}
  {% unless fig_src %}
    {% assign found = site.static_files | where: "path", p | first %}
    {% if found %}{% assign fig_src = p %}{% endif %}
  {% endunless %}
{% endfor %}
{% if fig_src %}
<figure class="research-figure">
  <img src="{{ fig_src | relative_url }}" alt="{{ site.data.group.research_figure.alt | escape }}" loading="eager">
  <figcaption>{{ site.data.group.research_figure.caption }}</figcaption>
</figure>
{% endif %}
